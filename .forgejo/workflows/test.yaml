name: Nix build
on: [push]
run-name: Test and build flake
jobs:
  nix-build:
    runs-on: nix
    strategy:
      matrix:
        attribute:
          - default
    steps:
      - name: Set HOME
        run: echo "HOME=$(dirname "$(pwd)")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - run: nix build --log-format bar-with-logs .#${{ matrix.attribute }} -v
      - run: archive-nix-path nix-output-monitor
  nix-flake-check:
    runs-on: nix
    steps:
      - name: Set HOME
        run: echo "HOME=$(dirname "$(pwd)")" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7.0.1
      - run: nix flake check --log-format bar-with-logs -v
